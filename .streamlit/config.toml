# Tema FIXO CLARO (fundo branco) com as cores oficiais da marca EnerMais: azul #171C60 e laranja #F99D20.
# Fixo para que todo mundo veja igual, independente da preferencia do sistema/navegador.
[theme]
base = "light"
primaryColor = "#171C60"
