# GDF V2 - titulos EM ABERTO por vencimento (2023..2032), somente leitura no Sienge. Completa a rotina diaria (que olha so' os ultimos 365 dias):
# inadimplencia antiga e parcelas futuras de financiamentos. Semanal (domingo 06:00 Brasilia) e sob demanda: Actions > "Ingest abertos GDF" > Run workflow.
# "gravar = nao" (padrao no disparo manual) so' mede volume e tempo, sem tocar no banco.
# Secrets: SIENGE_USER, SIENGE_PASSWORD, SIENGE_BASE_URL, DATABASE_URL (mesmos da rotina diaria). O repositorio e' publico: so' imprime contagens.
name: Ingest abertos GDF

on:
  schedule:
    - cron: "0 9 * * 0"      # 09:00 UTC = 06:00 em Brasilia, domingos
  workflow_dispatch:
    inputs:
      gravar:
        description: "Gravar no banco? 'sim' grava; qualquer outra coisa so' mede (conta titulos e tempo)."
        required: false
        default: "nao"
      ini:
        description: "Primeiro mes (AAAA-MM). Vazio = 2023-01."
        required: false
        default: ""
      fim:
        description: "Ultimo mes (AAAA-MM). Vazio = 2032-12."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ingest-sienge-gdf
  cancel-in-progress: false

jobs:
  abertos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencia
        run: pip install psycopg2-binary==2.9.13
      - name: Buscar titulos em aberto
        env:
          SIENGE_USER: ${{ secrets.SIENGE_USER }}
          SIENGE_PASSWORD: ${{ secrets.SIENGE_PASSWORD }}
          SIENGE_BASE_URL: ${{ secrets.SIENGE_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GDF_ABERTOS_GRAVAR: ${{ github.event_name == 'schedule' && 'sim' || github.event.inputs.gravar }}
          GDF_ABERTOS_INI: ${{ github.event.inputs.ini }}
          GDF_ABERTOS_FIM: ${{ github.event.inputs.fim }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/ingest_abertos_gdf.py
