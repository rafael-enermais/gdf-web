# GDF V2 - rotina diaria Sienge -> Supabase (somente leitura no Sienge). Roda todo dia as 04:30 (Brasilia), ultimos 365 dias, e pode ser disparada na hora
# em Actions > "Ingest Sienge GDF" > Run workflow (opcional: informar meses AAAA-MM separados por virgula).
# Secrets necessarios (Settings > Secrets and variables > Actions; valor PURO, sem aspas): SIENGE_USER, SIENGE_PASSWORD, SIENGE_BASE_URL, DATABASE_URL.
# O repositorio e' publico: o script so' imprime contagens.
name: Ingest Sienge GDF

on:
  schedule:
    - cron: "30 7 * * *"     # 07:30 UTC = 04:30 em Brasilia: ultimos 365 dias (13 meses, 4 chamadas, ~2 min)
  workflow_dispatch:
    inputs:
      meses:
        description: "Meses a buscar (AAAA-MM, separados por virgula). Vazio = ultimos 365 dias (13 meses)."
        required: false
        default: ""
      diagnostico:
        description: "Só medir volume/tempo e procurar chaves repetidas (não grava nada no banco)?"
        type: boolean
        required: false
        default: false

      banco:
        description: "Só olhar o movimento bancário do Sienge (juros/tarifas de banco) de um mês, sem gravar nada? (usa o campo meses = AAAA-MM; vazio = 2026-09)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ingest-sienge-gdf
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencia
        run: pip install psycopg2-binary==2.9.13
      - name: Buscar no Sienge e gravar no Supabase
        if: ${{ github.event.inputs.diagnostico != 'true' && github.event.inputs.banco != 'true' }}
        env:
          SIENGE_USER: ${{ secrets.SIENGE_USER }}
          SIENGE_PASSWORD: ${{ secrets.SIENGE_PASSWORD }}
          SIENGE_BASE_URL: ${{ secrets.SIENGE_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GDF_MESES: ${{ github.event.inputs.meses }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/ingest_sienge_gdf.py
      - name: Diagnostico (somente leitura, nao grava)
        if: ${{ github.event.inputs.diagnostico == 'true' }}
        env:
          SIENGE_USER: ${{ secrets.SIENGE_USER }}
          SIENGE_PASSWORD: ${{ secrets.SIENGE_PASSWORD }}
          SIENGE_BASE_URL: ${{ secrets.SIENGE_BASE_URL }}
          PYTHONUNBUFFERED: "1"
          GDF_DIAG_LADOS: "P"
          GDF_DIAG_TIPOS: "P"
          GDF_DIAG_INICIO: "2026-01"
          GDF_DIAG_FIM: "2026-03"
        run: python scripts/diagnostico_sienge_gdf.py
      - name: Movimento bancario (somente leitura, nao grava)
        if: ${{ github.event.inputs.banco == 'true' }}
        env:
          SIENGE_USER: ${{ secrets.SIENGE_USER }}
          SIENGE_PASSWORD: ${{ secrets.SIENGE_PASSWORD }}
          SIENGE_BASE_URL: ${{ secrets.SIENGE_BASE_URL }}
          GDF_BANCO_MES: ${{ github.event.inputs.meses }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/diagnostico_banco_sienge_gdf.py
